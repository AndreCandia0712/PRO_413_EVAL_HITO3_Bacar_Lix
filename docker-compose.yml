services:
  app:
    build: .
    image: gestion-escolar:nombre-grupo
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    working_dir: /var/www
    env_file:
      - .env
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: gestion_escolar
      MYSQL_USER: medina_pablo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
